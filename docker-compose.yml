services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: worldofchatgpt
      POSTGRES_PASSWORD: worldofchatgpt
      POSTGRES_DB: worldofchatgpt
    ports:
      - "5432:5432"
    volumes:
      - worldofchatgpt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldofchatgpt -d worldofchatgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  worldofchatgpt_pg:
